<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Finance Dashboard screenshot</title>
  <desc id="desc">A guide screenshot of the finance dashboard with quick actions, finance workflow, invoices, payments, expenses, and requisitions.</desc>
  <style>.bg{fill:#f6f8fb}.side{fill:#071f3f}.top,.panel,.card{fill:#fff}.hero{fill:#071426}.gold{fill:#d5a33a}.text{fill:#071426;font:700 22px Arial}.small{fill:#64748b;font:500 15px Arial}.white{fill:#fff}.label{fill:#637083;font:700 13px Arial}.num{fill:#071426;font:900 31px Arial}</style>
  <rect width="1200" height="675" class="bg"/><rect width="148" height="675" class="side"/><rect x="16" y="18" width="116" height="32" fill="#fff"/><text x="54" y="39" fill="#071426" font-family="Arial" font-size="12" font-weight="900">KFMS</text><rect x="148" width="1052" height="58" class="top"/><text x="185" y="37" class="text">Finance Dashboard</text><rect x="890" y="17" width="118" height="30" rx="15" fill="#fff" stroke="#cfd9e6"/><text x="914" y="37" font-family="Arial" font-size="14" font-weight="800" fill="#071426">Quick Actions</text>
  <rect x="176" y="88" width="980" height="110" rx="8" class="hero"/><text x="202" y="122" class="gold" font-family="Arial" font-size="13" font-weight="900">FINANCE CONTROL ROOM</text><text x="202" y="158" class="white" font-family="Arial" font-size="25" font-weight="900">Track billing, payments, expenses, and requisitions.</text><text x="202" y="187" fill="#d7e3f0" font-family="Arial" font-size="16">Use quick actions to record invoices, payment receipts, petty cash, and ledger movements without congestion.</text><rect x="838" y="128" width="92" height="32" rx="6" class="gold"/><text x="854" y="149" font-family="Arial" font-size="13" font-weight="900" fill="#071426">Invoice</text><rect x="942" y="128" width="92" height="32" rx="6" fill="none" stroke="#7f91a8"/><text x="960" y="149" class="white" font-family="Arial" font-size="13" font-weight="800">Payment</text><rect x="1046" y="128" width="92" height="32" rx="6" fill="none" stroke="#7f91a8"/><text x="1064" y="149" class="white" font-family="Arial" font-size="13" font-weight="800">Expense</text>
  <g transform="translate(176 222)"><rect width="154" height="76" rx="8" class="card" stroke="#d8e2ef"/><text x="20" y="28" class="label">Total Invoiced</text><text x="20" y="62" class="num">0</text><rect x="166" width="154" height="76" rx="8" class="card" stroke="#d8e2ef"/><text x="186" y="28" class="label">Collected</text><text x="186" y="62" class="num">0</text><rect x="332" width="154" height="76" rx="8" class="card" stroke="#d8e2ef"/><text x="352" y="28" class="label">Outstanding</text><text x="352" y="62" class="num">0</text><rect x="498" width="154" height="76" rx="8" class="card" stroke="#d8e2ef"/><text x="518" y="28" class="label">Petty Cash</text><text x="518" y="62" class="num">0</text><rect x="664" width="154" height="76" rx="8" class="card" stroke="#d8e2ef"/><text x="684" y="28" class="label">Expenses</text><text x="684" y="62" class="num">0</text><rect x="830" width="150" height="76" rx="8" class="card" stroke="#d8e2ef"/><text x="850" y="28" class="label">Requisitions</text><text x="850" y="62" class="num">0</text></g>
  <rect x="176" y="318" width="980" height="134" rx="8" class="panel" stroke="#d8e2ef"/><text x="202" y="354" class="text" font-size="18">Finance Workflow</text><text x="202" y="382" class="small">From spending requests to invoicing and collection</text><g transform="translate(202 408)"><rect width="170" height="36" rx="6" fill="#eef5fb" stroke="#d8e2ef"/><text x="22" y="23" class="label">1 Requisitions</text><rect x="185" width="170" height="36" rx="6" fill="#eef5fb" stroke="#d8e2ef"/><text x="207" y="23" class="label">2 Approved</text><rect x="370" width="170" height="36" rx="6" fill="#eef5fb" stroke="#d8e2ef"/><text x="392" y="23" class="label">3 Expenses</text><rect x="555" width="170" height="36" rx="6" fill="#eef5fb" stroke="#d8e2ef"/><text x="577" y="23" class="label">4 Invoices</text><rect x="740" width="170" height="36" rx="6" fill="#eef5fb" stroke="#d8e2ef"/><text x="762" y="23" class="label">5 Payments</text></g>
  <rect x="176" y="472" width="480" height="128" rx="8" class="panel" stroke="#d8e2ef"/><text x="202" y="508" class="text" font-size="18">Recent Invoices</text><rect x="202" y="538" width="428" height="34" fill="#eef5fb" stroke="#d8e2ef"/><text x="218" y="560" class="label">INVOICE</text><text x="380" y="560" class="label">CLIENT</text><text x="548" y="560" class="label">STATUS</text>
  <rect x="676" y="472" width="480" height="128" rx="8" class="panel" stroke="#d8e2ef"/><text x="702" y="508" class="text" font-size="18">Requisitions Awaiting Approval</text><rect x="702" y="538" width="428" height="34" fill="#eef5fb" stroke="#d8e2ef"/><text x="718" y="560" class="label">REFERENCE</text><text x="880" y="560" class="label">AMOUNT</text><text x="1048" y="560" class="label">STATUS</text>
</svg>
