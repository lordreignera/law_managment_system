<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Recovery Dashboard screenshot</title>
  <desc id="desc">A guide screenshot of the recovery dashboard with portfolio actions, outstanding balances, officer load, and bank portfolio table.</desc>
  <style>.bg{fill:#f6f8fb}.side{fill:#071f3f}.top,.panel,.card{fill:#fff}.hero{fill:#071426}.gold{fill:#d5a33a}.text{fill:#071426;font:700 22px Arial}.small{fill:#64748b;font:500 15px Arial}.white{fill:#fff}.label{fill:#637083;font:700 13px Arial}.num{fill:#071426;font:900 31px Arial}</style>
  <rect width="1200" height="675" class="bg"/><rect width="148" height="675" class="side"/><rect x="16" y="18" width="116" height="32" fill="#fff"/><text x="54" y="39" fill="#071426" font-family="Arial" font-size="12" font-weight="900">KFMS</text>
  <rect x="148" width="1052" height="58" class="top"/><text x="185" y="37" class="text">Recovery Dashboard</text><rect x="890" y="17" width="118" height="30" rx="15" fill="#fff" stroke="#cfd9e6"/><text x="914" y="37" font-family="Arial" font-size="14" font-weight="800" fill="#071426">Quick Actions</text>
  <rect x="176" y="88" width="980" height="110" rx="8" class="hero"/><text x="202" y="122" class="gold" font-family="Arial" font-size="13" font-weight="900">RECOVERY CONTROL ROOM</text><text x="202" y="158" class="white" font-family="Arial" font-size="25" font-weight="900">Import, assign, and monitor client recovery portfolios.</text><text x="202" y="187" fill="#d7e3f0" font-family="Arial" font-size="16">Managers track imported bank portfolios, assignment coverage, collections, and officer performance from one place.</text><rect x="838" y="128" width="116" height="32" rx="6" class="gold"/><text x="852" y="149" font-family="Arial" font-size="13" font-weight="900" fill="#071426">Import Portfolio</text><rect x="966" y="128" width="82" height="32" rx="6" fill="none" stroke="#7f91a8"/><text x="987" y="149" class="white" font-family="Arial" font-size="13" font-weight="800">Register</text><rect x="1060" y="128" width="78" height="32" rx="6" fill="none" stroke="#7f91a8"/><text x="1073" y="149" class="white" font-family="Arial" font-size="13" font-weight="800">Banks</text>
  <g transform="translate(176 222)"><rect width="230" height="76" rx="8" class="card" stroke="#d8e2ef"/><text x="20" y="28" class="label">Active Accounts</text><text x="20" y="62" class="num">9</text><rect x="246" width="230" height="76" rx="8" class="card" stroke="#d8e2ef"/><text x="266" y="28" class="label">Unassigned</text><text x="266" y="62" class="num">0</text><rect x="492" width="230" height="76" rx="8" class="card" stroke="#d8e2ef"/><text x="512" y="28" class="label">Net Outstanding</text><text x="512" y="62" class="num">86,472,442</text><rect x="738" width="242" height="76" rx="8" class="card" stroke="#d8e2ef"/><text x="758" y="28" class="label">Recovered</text><text x="758" y="62" class="num">500,000</text></g>
  <rect x="176" y="318" width="480" height="144" rx="8" class="panel" stroke="#d8e2ef"/><text x="202" y="354" class="text" font-size="18">Recent Imports</text><text x="202" y="382" class="small">Latest portfolio batches</text><rect x="202" y="406" width="428" height="35" fill="#eef5fb" stroke="#d8e2ef"/><text x="218" y="429" class="label">BATCH</text><text x="374" y="429" class="label">CLIENT</text><text x="534" y="429" class="label">STATUS</text>
  <rect x="676" y="318" width="480" height="144" rx="8" class="panel" stroke="#d8e2ef"/><text x="702" y="354" class="text" font-size="18">Officer Load</text><text x="702" y="382" class="small">Active recovery workload and collections</text><rect x="702" y="406" width="428" height="35" fill="#eef5fb" stroke="#d8e2ef"/><text x="718" y="429" class="label">OFFICER</text><text x="878" y="429" class="label">ACTIVE</text><text x="1024" y="429" class="label">RECOVERED</text>
  <rect x="176" y="484" width="980" height="128" rx="8" class="panel" stroke="#d8e2ef"/><text x="202" y="520" class="text" font-size="18">Recovery Clients</text><text x="202" y="548" class="small">Client portfolios and current exposure</text><rect x="202" y="570" width="928" height="32" fill="#eef5fb" stroke="#d8e2ef"/><text x="218" y="592" class="label">CLIENT</text><text x="488" y="592" class="label">PORTFOLIO TYPES</text><text x="822" y="592" class="label">NET OUTSTANDING</text>
