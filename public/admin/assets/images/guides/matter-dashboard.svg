<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Matter Dashboard screenshot</title>
  <desc id="desc">A guide screenshot of the matter dashboard with pipeline, practice areas, assigned work, and recent matters.</desc>
  <style>.bg{fill:#f6f8fb}.side{fill:#071f3f}.top,.panel,.card{fill:#fff}.hero{fill:#071426}.gold{fill:#d5a33a}.text{fill:#071426;font:700 22px Arial}.small{fill:#64748b;font:500 15px Arial}.white{fill:#fff}.label{fill:#637083;font:700 13px Arial}.num{fill:#071426;font:900 34px Arial}.bar{fill:#e8eef5}.bar2{fill:#0b69b6}</style>
  <rect width="1200" height="675" class="bg"/><rect width="148" height="675" class="side"/><rect x="16" y="18" width="116" height="32" fill="#fff"/><text x="54" y="39" fill="#071426" font-family="Arial" font-size="12" font-weight="900">KFMS</text><rect x="148" width="1052" height="58" class="top"/><text x="185" y="37" class="text">Matter Dashboard</text><rect x="890" y="17" width="118" height="30" rx="15" fill="#fff" stroke="#cfd9e6"/><text x="914" y="37" font-family="Arial" font-size="14" font-weight="800" fill="#071426">Quick Actions</text>
  <rect x="176" y="88" width="980" height="110" rx="8" class="hero"/><text x="202" y="122" class="gold" font-family="Arial" font-size="13" font-weight="900">MATTER CONTROL ROOM</text><text x="202" y="158" class="white" font-family="Arial" font-size="25" font-weight="900">Open, monitor, and move client matters through the firm.</text><text x="202" y="187" fill="#d7e3f0" font-family="Arial" font-size="16">Track registers, active work, billing status, responsible advocates, and recent matter movement.</text><rect x="922" y="128" width="86" height="32" rx="6" class="gold"/><text x="941" y="149" font-family="Arial" font-size="13" font-weight="900" fill="#071426">Register</text><rect x="1020" y="128" width="118" height="32" rx="6" fill="none" stroke="#7f91a8"/><text x="1038" y="149" class="white" font-family="Arial" font-size="13" font-weight="800">New Matter</text>
  <g transform="translate(176 222)"><rect width="230" height="76" rx="8" class="card" stroke="#d8e2ef"/><text x="20" y="28" class="label">Open Matters</text><text x="20" y="62" class="num">1</text><rect x="246" width="230" height="76" rx="8" class="card" stroke="#d8e2ef"/><text x="266" y="28" class="label">File Pending</text><text x="266" y="62" class="num">0</text><rect x="492" width="230" height="76" rx="8" class="card" stroke="#d8e2ef"/><text x="512" y="28" class="label">Active Work</text><text x="512" y="62" class="num">0</text><rect x="738" width="242" height="76" rx="8" class="card" stroke="#d8e2ef"/><text x="758" y="28" class="label">Billing Pending</text><text x="758" y="62" class="num">0</text></g>
  <rect x="176" y="318" width="480" height="178" rx="8" class="panel" stroke="#d8e2ef"/><text x="202" y="354" class="text" font-size="18">Matter Pipeline</text><text x="202" y="382" class="small">Matter status movement across the firm</text><rect x="320" y="416" width="280" height="10" rx="5" class="bar"/><rect x="320" y="416" width="80" height="10" rx="5" class="bar2"/><text x="202" y="425" class="label">Open</text><rect x="320" y="452" width="280" height="10" rx="5" class="bar"/><rect x="320" y="452" width="42" height="10" rx="5" class="bar2"/><text x="202" y="461" class="label">Under Review</text>
  <rect x="676" y="318" width="480" height="178" rx="8" class="panel" stroke="#d8e2ef"/><text x="702" y="354" class="text" font-size="18">Practice Areas</text><text x="702" y="382" class="small">Active files by legal category</text><rect x="702" y="410" width="428" height="35" fill="#eef5fb" stroke="#d8e2ef"/><text x="718" y="433" class="label">PRACTICE AREA</text><text x="1018" y="433" class="label">COUNT</text>
  <rect x="176" y="516" width="480" height="96" rx="8" class="panel" stroke="#d8e2ef"/><text x="202" y="552" class="text" font-size="18">My Matter Work</text><text x="202" y="580" class="small">Open files assigned to you</text>
  <rect x="676" y="516" width="480" height="96" rx="8" class="panel" stroke="#d8e2ef"/><text x="702" y="552" class="text" font-size="18">Recent Matters</text><text x="702" y="580" class="small">Latest files opened in the system</text>
</svg>
