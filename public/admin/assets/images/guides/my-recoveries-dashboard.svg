<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">My Recoveries screenshot</title>
  <desc id="desc">A guide screenshot of a recovery officer dashboard with assigned accounts, activity reporting, and charts.</desc>
  <style>.bg{fill:#f6f8fb}.side{fill:#071f3f}.top,.panel,.card{fill:#fff}.hero{fill:#071426}.gold{fill:#d5a33a}.text{fill:#071426;font:700 22px Arial}.small{fill:#64748b;font:500 15px Arial}.white{fill:#fff}.label{fill:#637083;font:700 13px Arial}.num{fill:#071426;font:900 31px Arial}.blue{fill:#0b69b6}.green{fill:#0f8f5b}</style>
  <rect width="1200" height="675" class="bg"/><rect width="148" height="675" class="side"/><rect x="16" y="18" width="116" height="32" fill="#fff"/><text x="54" y="39" fill="#071426" font-family="Arial" font-size="12" font-weight="900">KFMS</text><rect x="148" width="1052" height="58" class="top"/><text x="185" y="37" class="text">My Recoveries</text><rect x="890" y="17" width="118" height="30" rx="15" fill="#fff" stroke="#cfd9e6"/><text x="914" y="37" font-family="Arial" font-size="14" font-weight="800" fill="#071426">Quick Actions</text>
  <rect x="176" y="88" width="980" height="110" rx="8" class="hero"/><text x="202" y="122" class="gold" font-family="Arial" font-size="13" font-weight="900">RECOVERY OFFICER DESK</text><text x="202" y="158" class="white" font-family="Arial" font-size="25" font-weight="900">Follow up assigned accounts and report collections.</text><text x="202" y="187" fill="#d7e3f0" font-family="Arial" font-size="16">Log phone calls, promises, payments, receipts, and daily collection activity from one dashboard.</text><rect x="930" y="128" width="92" height="32" rx="6" class="gold"/><text x="946" y="149" font-family="Arial" font-size="13" font-weight="900" fill="#071426">Report</text><rect x="1034" y="128" width="104" height="32" rx="6" fill="none" stroke="#7f91a8"/><text x="1053" y="149" class="white" font-family="Arial" font-size="13" font-weight="800">Export</text>
  <g transform="translate(176 222)"><rect width="230" height="76" rx="8" class="card" stroke="#d8e2ef"/><text x="20" y="28" class="label">Assigned</text><text x="20" y="62" class="num">9</text><rect x="246" width="230" height="76" rx="8" class="card" stroke="#d8e2ef"/><text x="266" y="28" class="label">Recovered</text><text x="266" y="62" class="num">500,000</text><rect x="492" width="230" height="76" rx="8" class="card" stroke="#d8e2ef"/><text x="512" y="28" class="label">This Week</text><text x="512" y="62" class="num">200,000</text><rect x="738" width="242" height="76" rx="8" class="card" stroke="#d8e2ef"/><text x="758" y="28" class="label">Outstanding</text><text x="758" y="62" class="num">86,472,442</text></g>
  <rect x="176" y="318" width="612" height="178" rx="8" class="panel" stroke="#d8e2ef"/><text x="202" y="354" class="text" font-size="18">Accounts Assigned to Me</text><text x="202" y="382" class="small">Filter, export, view, and report account activity</text><rect x="202" y="408" width="560" height="36" fill="#eef5fb" stroke="#d8e2ef"/><text x="218" y="432" class="label">DEBTOR</text><text x="452" y="432" class="label">NET OUTSTANDING</text><text x="650" y="432" class="label">ACTIONS</text><text x="218" y="472" class="small">BABIRYE PROSSY BABIRYE</text><rect x="660" y="454" width="82" height="26" rx="5" fill="#071426"/><text x="676" y="472" class="white" font-family="Arial" font-size="12" font-weight="800">Report</text>
  <rect x="808" y="318" width="348" height="178" rx="8" class="panel" stroke="#d8e2ef"/><text x="834" y="354" class="text" font-size="18">Collection Reports</text><circle cx="910" cy="424" r="50" class="blue"/><path d="M910 374 A50 50 0 0 1 957 441 L910 424 Z" class="green"/><rect x="990" y="398" width="90" height="12" rx="6" class="blue"/><rect x="990" y="430" width="70" height="12" rx="6" class="green"/>
  <rect x="176" y="516" width="980" height="96" rx="8" class="panel" stroke="#d8e2ef"/><text x="202" y="552" class="text" font-size="18">Daily, Weekly, and Monthly Exports</text><text x="202" y="580" class="small">Track collections and remaining balances by reporting period.</text>
</svg>
