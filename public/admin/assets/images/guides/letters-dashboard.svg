<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Letters Dashboard screenshot</title>
  <desc id="desc">A guide screenshot of the letters and opinions dashboard with drafts, reviews, templates, and recent letters.</desc>
  <style>.bg{fill:#f6f8fb}.side{fill:#071f3f}.top,.panel,.card{fill:#fff}.hero{fill:#071426}.gold{fill:#d5a33a}.text{fill:#071426;font:700 22px Arial}.small{fill:#64748b;font:500 15px Arial}.white{fill:#fff}.label{fill:#637083;font:700 13px Arial}.num{fill:#071426;font:900 34px Arial}</style>
  <rect width="1200" height="675" class="bg"/><rect width="148" height="675" class="side"/><rect x="16" y="18" width="116" height="32" fill="#fff"/><text x="54" y="39" fill="#071426" font-family="Arial" font-size="12" font-weight="900">KFMS</text><rect x="148" width="1052" height="58" class="top"/><text x="185" y="37" class="text">Letters &amp; Opinions</text><rect x="890" y="17" width="118" height="30" rx="15" fill="#fff" stroke="#cfd9e6"/><text x="914" y="37" font-family="Arial" font-size="14" font-weight="800" fill="#071426">Quick Actions</text>
  <rect x="176" y="88" width="980" height="110" rx="8" class="hero"/><text x="202" y="122" class="gold" font-family="Arial" font-size="13" font-weight="900">LETTERS &amp; OPINIONS CONTROL ROOM</text><text x="202" y="158" class="white" font-family="Arial" font-size="25" font-weight="900">Draft, review, approve, and dispatch firm correspondence.</text><text x="202" y="187" fill="#d7e3f0" font-family="Arial" font-size="16">Create branded letters, legal opinions, demand notices, templates, and received-copy records.</text><rect x="936" y="128" width="104" height="32" rx="6" class="gold"/><text x="954" y="149" font-family="Arial" font-size="13" font-weight="900" fill="#071426">Create Letter</text><rect x="1052" y="128" width="86" height="32" rx="6" fill="none" stroke="#7f91a8"/><text x="1072" y="149" class="white" font-family="Arial" font-size="13" font-weight="800">Templates</text>
  <g transform="translate(176 222)"><rect width="230" height="76" rx="8" class="card" stroke="#d8e2ef"/><text x="20" y="28" class="label">Drafts</text><text x="20" y="62" class="num">0</text><rect x="246" width="230" height="76" rx="8" class="card" stroke="#d8e2ef"/><text x="266" y="28" class="label">Pending Review</text><text x="266" y="62" class="num">0</text><rect x="492" width="230" height="76" rx="8" class="card" stroke="#d8e2ef"/><text x="512" y="28" class="label">Sent</text><text x="512" y="62" class="num">0</text><rect x="738" width="242" height="76" rx="8" class="card" stroke="#d8e2ef"/><text x="758" y="28" class="label">Received Copies</text><text x="758" y="62" class="num">0</text></g>
  <rect x="176" y="318" width="980" height="144" rx="8" class="panel" stroke="#d8e2ef"/><text x="202" y="354" class="text" font-size="18">Document Workspace</text><text x="202" y="382" class="small">Create branded letters, opinions, notices, and client correspondence</text><g transform="translate(202 408)"><rect width="214" height="42" rx="6" fill="#eef5fb" stroke="#d8e2ef"/><text x="20" y="27" class="label">Draft Letter</text><rect x="230" width="214" height="42" rx="6" fill="#eef5fb" stroke="#d8e2ef"/><text x="250" y="27" class="label">Legal Opinion</text><rect x="460" width="214" height="42" rx="6" fill="#eef5fb" stroke="#d8e2ef"/><text x="480" y="27" class="label">Demand Notice</text><rect x="690" width="214" height="42" rx="6" fill="#eef5fb" stroke="#d8e2ef"/><text x="710" y="27" class="label">Review Queue</text></g>
  <rect x="176" y="484" width="480" height="116" rx="8" class="panel" stroke="#d8e2ef"/><text x="202" y="520" class="text" font-size="18">Recent Letters</text><rect x="202" y="550" width="428" height="34" fill="#eef5fb" stroke="#d8e2ef"/><text x="218" y="572" class="label">REFERENCE</text><text x="380" y="572" class="label">SUBJECT</text><text x="548" y="572" class="label">STATUS</text>
  <rect x="676" y="484" width="480" height="116" rx="8" class="panel" stroke="#d8e2ef"/><text x="702" y="520" class="text" font-size="18">Pending Review</text><rect x="702" y="550" width="428" height="34" fill="#eef5fb" stroke="#d8e2ef"/><text x="718" y="572" class="label">RECIPIENT</text><text x="880" y="572" class="label">TYPE</text><text x="1048" y="572" class="label">ACTION</text>
