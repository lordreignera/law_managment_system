<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Client Management screenshot</title>
  <desc id="desc">A guide screenshot of client management with intake, approved clients, conflict checks, and engagement records.</desc>
  <style>.bg{fill:#f6f8fb}.side{fill:#071f3f}.top,.panel,.card{fill:#fff}.hero{fill:#071426}.gold{fill:#d5a33a}.text{fill:#071426;font:700 22px Arial}.small{fill:#64748b;font:500 15px Arial}.white{fill:#fff}.label{fill:#637083;font:700 13px Arial}.num{fill:#071426;font:900 34px Arial}</style>
  <rect width="1200" height="675" class="bg"/><rect width="148" height="675" class="side"/><rect x="16" y="18" width="116" height="32" fill="#fff"/><text x="54" y="39" fill="#071426" font-family="Arial" font-size="12" font-weight="900">KFMS</text><rect x="148" width="1052" height="58" class="top"/><text x="185" y="37" class="text">Client Management</text><rect x="890" y="17" width="118" height="30" rx="15" fill="#fff" stroke="#cfd9e6"/><text x="914" y="37" font-family="Arial" font-size="14" font-weight="800" fill="#071426">Quick Actions</text>
  <rect x="176" y="88" width="980" height="110" rx="8" class="hero"/><text x="202" y="122" class="gold" font-family="Arial" font-size="13" font-weight="900">CLIENT CONTROL ROOM</text><text x="202" y="158" class="white" font-family="Arial" font-size="25" font-weight="900">Capture, review, and approve client records.</text><text x="202" y="187" fill="#d7e3f0" font-family="Arial" font-size="16">Manage intakes, conflict details, approved clients, engagement contacts, and client portal access.</text><rect x="920" y="128" width="100" height="32" rx="6" class="gold"/><text x="938" y="149" font-family="Arial" font-size="13" font-weight="900" fill="#071426">New Intake</text><rect x="1032" y="128" width="106" height="32" rx="6" fill="none" stroke="#7f91a8"/><text x="1050" y="149" class="white" font-family="Arial" font-size="13" font-weight="800">Approved</text>
  <g transform="translate(176 222)"><rect width="230" height="76" rx="8" class="card" stroke="#d8e2ef"/><text x="20" y="28" class="label">Pending Intakes</text><text x="20" y="62" class="num">0</text><rect x="246" width="230" height="76" rx="8" class="card" stroke="#d8e2ef"/><text x="266" y="28" class="label">Approved Clients</text><text x="266" y="62" class="num">1</text><rect x="492" width="230" height="76" rx="8" class="card" stroke="#d8e2ef"/><text x="512" y="28" class="label">Conflict Review</text><text x="512" y="62" class="num">0</text><rect x="738" width="242" height="76" rx="8" class="card" stroke="#d8e2ef"/><text x="758" y="28" class="label">Portal Accounts</text><text x="758" y="62" class="num">0</text></g>
  <rect x="176" y="318" width="980" height="278" rx="8" class="panel" stroke="#d8e2ef"/><text x="202" y="354" class="text" font-size="18">Client Register</text><text x="202" y="382" class="small">Search client name, email, phone, category, and approval status</text><rect x="202" y="414" width="928" height="38" fill="#fff" stroke="#d8e2ef"/><text x="226" y="439" class="small">Search clients or intakes</text><rect x="202" y="480" width="928" height="35" fill="#eef5fb" stroke="#d8e2ef"/><text x="218" y="503" class="label">CLIENT</text><text x="440" y="503" class="label">CONTACT</text><text x="650" y="503" class="label">STATUS</text><text x="910" y="503" class="label">ACTION</text>
</svg>
