<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Messages screenshot</title>
  <desc id="desc">A guide screenshot of the messages workspace with conversation list, message thread, and file context.</desc>
  <style>.bg{fill:#f6f8fb}.side{fill:#071f3f}.top,.panel,.card{fill:#fff}.hero{fill:#071426}.gold{fill:#d5a33a}.text{fill:#071426;font:700 22px Arial}.small{fill:#64748b;font:500 15px Arial}.white{fill:#fff}.label{fill:#637083;font:700 13px Arial}.bubble{fill:#eef5fb}.mine{fill:#e7f0ff}</style>
  <rect width="1200" height="675" class="bg"/><rect width="148" height="675" class="side"/><rect x="16" y="18" width="116" height="32" fill="#fff"/><text x="54" y="39" fill="#071426" font-family="Arial" font-size="12" font-weight="900">KFMS</text><rect x="148" width="1052" height="58" class="top"/><text x="185" y="37" class="text">Messages</text><rect x="890" y="17" width="118" height="30" rx="15" fill="#fff" stroke="#cfd9e6"/><text x="914" y="37" font-family="Arial" font-size="14" font-weight="800" fill="#071426">Quick Actions</text>
  <rect x="176" y="88" width="980" height="110" rx="8" class="hero"/><text x="202" y="122" class="gold" font-family="Arial" font-size="13" font-weight="900">MESSAGES CONTROL ROOM</text><text x="202" y="158" class="white" font-family="Arial" font-size="25" font-weight="900">Communicate with teams, clients, and departments.</text><text x="202" y="187" fill="#d7e3f0" font-family="Arial" font-size="16">Use direct conversations, department notices, branch updates, and matter-linked messages.</text><rect x="992" y="128" width="146" height="32" rx="6" class="gold"/><text x="1012" y="149" font-family="Arial" font-size="13" font-weight="900" fill="#071426">New Message</text>
  <rect x="176" y="222" width="260" height="374" rx="8" class="panel" stroke="#d8e2ef"/><text x="202" y="258" class="text" font-size="18">Conversations</text><rect x="202" y="286" width="208" height="34" fill="#fff" stroke="#d8e2ef"/><text x="220" y="308" class="small">Search inbox</text><rect x="202" y="346" width="208" height="54" rx="6" class="bubble" stroke="#d8e2ef"/><text x="220" y="369" class="label">Finance team</text><text x="220" y="389" class="small">Latest update...</text><rect x="202" y="412" width="208" height="54" rx="6" fill="#fff" stroke="#d8e2ef"/><text x="220" y="435" class="label">Client thread</text><text x="220" y="455" class="small">Document received</text>
  <rect x="456" y="222" width="420" height="374" rx="8" class="panel" stroke="#d8e2ef"/><text x="482" y="258" class="text" font-size="18">Finance team</text><line x1="482" y1="282" x2="850" y2="282" stroke="#d8e2ef"/><rect x="482" y="324" width="242" height="54" rx="8" class="bubble"/><text x="504" y="354" class="small">Please review the payment record.</text><rect x="608" y="404" width="242" height="54" rx="8" class="mine"/><text x="630" y="434" class="small">Received, checking now.</text><rect x="482" y="522" width="368" height="42" fill="#fff" stroke="#d8e2ef"/><text x="504" y="548" class="small">Write a message</text>
  <rect x="896" y="222" width="260" height="374" rx="8" class="panel" stroke="#d8e2ef"/><text x="922" y="258" class="text" font-size="18">Context</text><text x="922" y="290" class="small">Linked files and participants</text><rect x="922" y="326" width="208" height="54" rx="6" fill="#fff" stroke="#d8e2ef"/><text x="940" y="358" class="label">Attachments</text><rect x="922" y="402" width="208" height="54" rx="6" fill="#fff" stroke="#d8e2ef"/><text x="940" y="434" class="label">Participants</text>
</svg>
