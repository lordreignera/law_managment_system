<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Securities Dashboard screenshot</title>
  <desc id="desc">A guide screenshot of the securities dashboard with custody KPIs, status breakdown, and security movement panels.</desc>
  <style>.bg{fill:#f6f8fb}.side{fill:#071f3f}.top,.panel,.card{fill:#fff}.hero{fill:#071426}.gold{fill:#d5a33a}.text{fill:#071426;font:700 22px Arial}.small{fill:#64748b;font:500 15px Arial}.white{fill:#fff}.label{fill:#637083;font:700 13px Arial}.num{fill:#071426;font:900 34px Arial}.bar{fill:#e8eef5}.bar2{fill:#0b6b67}</style>
  <rect width="1200" height="675" class="bg"/><rect width="148" height="675" class="side"/><rect x="16" y="18" width="116" height="32" fill="#fff"/><text x="54" y="39" fill="#071426" font-family="Arial" font-size="12" font-weight="900">KFMS</text>
  <rect x="148" width="1052" height="58" class="top"/><text x="185" y="37" class="text">Securities Dashboard</text><rect x="890" y="17" width="118" height="30" rx="15" fill="#fff" stroke="#cfd9e6"/><text x="914" y="37" font-family="Arial" font-size="14" font-weight="800" fill="#071426">Quick Actions</text>
  <rect x="176" y="88" width="980" height="110" rx="8" class="hero"/><text x="202" y="122" class="gold" font-family="Arial" font-size="13" font-weight="900">SECURITIES CONTROL ROOM</text><text x="202" y="158" class="white" font-family="Arial" font-size="25" font-weight="900">Register, monitor, and track securities in custody.</text><text x="202" y="187" fill="#d7e3f0" font-family="Arial" font-size="16">Monitor documents received from financial institutions, movement to MZO or zonal offices, handlers, and returns.</text>
  <rect x="930" y="128" width="78" height="32" rx="6" class="gold"/><text x="954" y="149" font-family="Arial" font-size="13" font-weight="900" fill="#071426">Import</text><rect x="1020" y="128" width="88" height="32" rx="6" fill="none" stroke="#7f91a8"/><text x="1041" y="149" class="white" font-family="Arial" font-size="13" font-weight="800">Register</text>
  <g transform="translate(176 222)"><rect width="154" height="76" rx="8" class="card" stroke="#d8e2ef"/><text x="20" y="28" class="label">Total Securities</text><text x="20" y="62" class="num">0</text><rect x="166" width="154" height="76" rx="8" class="card" stroke="#d8e2ef"/><text x="186" y="28" class="label">In Custody</text><text x="186" y="62" class="num">0</text><rect x="332" width="154" height="76" rx="8" class="card" stroke="#d8e2ef"/><text x="352" y="28" class="label">Pending</text><text x="352" y="62" class="num">0</text><rect x="498" width="154" height="76" rx="8" class="card" stroke="#d8e2ef"/><text x="518" y="28" class="label">Dispatched</text><text x="518" y="62" class="num">0</text><rect x="664" width="154" height="76" rx="8" class="card" stroke="#d8e2ef"/><text x="684" y="28" class="label">Returned</text><text x="684" y="62" class="num">0</text><rect x="830" width="150" height="76" rx="8" class="card" stroke="#d8e2ef"/><text x="850" y="28" class="label">This Month</text><text x="850" y="62" class="num">0</text></g>
  <rect x="176" y="318" width="480" height="178" rx="8" class="panel" stroke="#d8e2ef"/><text x="202" y="354" class="text" font-size="18">Custody Queue</text><text x="202" y="382" class="small">Active securities awaiting return or closure</text><rect x="202" y="410" width="428" height="35" fill="#eef5fb" stroke="#d8e2ef"/><text x="218" y="433" class="label">REFERENCE</text><text x="375" y="433" class="label">BORROWER</text><text x="540" y="433" class="label">STATUS</text>
  <rect x="676" y="318" width="480" height="178" rx="8" class="panel" stroke="#d8e2ef"/><text x="702" y="354" class="text" font-size="18">Status Breakdown</text><text x="702" y="382" class="small">Current securities movement state</text><rect x="822" y="416" width="280" height="10" rx="5" class="bar"/><rect x="822" y="416" width="45" height="10" rx="5" class="bar2"/><text x="702" y="425" class="label">Pending</text><rect x="822" y="448" width="280" height="10" rx="5" class="bar"/><rect x="822" y="448" width="45" height="10" rx="5" class="bar2"/><text x="702" y="457" class="label">Returned</text>
  <rect x="176" y="516" width="480" height="96" rx="8" class="panel" stroke="#d8e2ef"/><text x="202" y="552" class="text" font-size="18">By Financial Institution</text><rect x="676" y="516" width="480" height="96" rx="8" class="panel" stroke="#d8e2ef"/><text x="702" y="552" class="text" font-size="18">By MZO / Zonal Office</text>
</svg>
