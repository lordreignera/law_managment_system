<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">HR Dashboard screenshot</title>
  <desc id="desc">A guide screenshot of the human resources dashboard with hero actions, KPI cards, headcount coverage, staff profiles, and leave calendar.</desc>
  <style>
    .bg{fill:#f6f8fb}.side{fill:#071f3f}.top,.panel,.card{fill:#fff}.line{stroke:#d8e2ef;stroke-width:1}.hero{fill:#071426}.gold{fill:#d5a33a}.text{fill:#071426;font:700 22px Arial}.small{fill:#64748b;font:500 15px Arial}.white{fill:#fff}.label{fill:#637083;font:700 13px Arial}.num{fill:#071426;font:900 34px Arial}
  </style>
  <rect width="1200" height="675" class="bg"/>
  <rect width="148" height="675" class="side"/>
  <rect x="16" y="18" width="116" height="32" fill="#fff"/>
  <text x="54" y="39" fill="#071426" font-family="Arial" font-size="12" font-weight="900">KFMS</text>
  <rect x="148" width="1052" height="58" class="top"/>
  <text x="185" y="37" class="text">HR Dashboard</text>
  <rect x="890" y="17" width="118" height="30" rx="15" fill="#fff" stroke="#cfd9e6"/>
  <text x="914" y="37" font-family="Arial" font-size="14" font-weight="800" fill="#071426">Quick Actions</text>
  <rect x="176" y="88" width="980" height="110" rx="8" class="hero"/>
  <text x="202" y="122" class="gold" font-family="Arial" font-size="13" font-weight="900">HUMAN RESOURCES CONTROL ROOM</text>
  <text x="202" y="158" class="white" font-family="Arial" font-size="25" font-weight="900">Manage staff access, leave, and team records.</text>
  <text x="202" y="187" fill="#d7e3f0" font-family="Arial" font-size="16">Track active staff, pending access, department coverage, branch headcount, and leave requests from one place.</text>
  <rect x="842" y="128" width="94" height="32" rx="6" class="gold"/><text x="862" y="149" font-family="Arial" font-size="13" font-weight="900" fill="#071426">New Staff</text>
  <rect x="948" y="128" width="104" height="32" rx="6" fill="none" stroke="#7f91a8"/><text x="967" y="149" class="white" font-family="Arial" font-size="13" font-weight="800">Staff Register</text>
  <rect x="1064" y="128" width="74" height="32" rx="6" fill="none" stroke="#7f91a8"/><text x="1080" y="149" class="white" font-family="Arial" font-size="13" font-weight="800">Leave</text>
  <g transform="translate(176 222)">
    <rect width="230" height="76" rx="8" class="card" stroke="#d8e2ef"/><text x="22" y="28" class="label">Active Staff</text><text x="22" y="62" class="num">3</text>
    <rect x="246" width="230" height="76" rx="8" class="card" stroke="#d8e2ef"/><text x="268" y="28" class="label">Pending Access</text><text x="268" y="62" class="num">0</text>
    <rect x="492" width="230" height="76" rx="8" class="card" stroke="#d8e2ef"/><text x="514" y="28" class="label">On Leave Today</text><text x="514" y="62" class="num">0</text>
    <rect x="738" width="242" height="76" rx="8" class="card" stroke="#d8e2ef"/><text x="760" y="28" class="label">Pending Leave</text><text x="760" y="62" class="num">0</text>
  </g>
  <rect x="176" y="318" width="980" height="156" rx="8" class="panel" stroke="#d8e2ef"/>
  <text x="202" y="354" class="text" font-size="18">Headcount Coverage</text>
  <line x1="202" y1="382" x2="1132" y2="382" class="line"/>
  <text x="214" y="416" class="small">Finance and Administration</text><text x="1118" y="416" class="num" font-size="18">2</text>
  <text x="214" y="452" class="small">Recoveries</text><text x="1128" y="452" class="num" font-size="18">1</text>
  <rect x="176" y="494" width="480" height="118" rx="8" class="panel" stroke="#d8e2ef"/><text x="202" y="530" class="text" font-size="18">Recent Staff Profiles</text><text x="202" y="560" class="small">Latest staff records in the system</text>
  <rect x="676" y="494" width="480" height="118" rx="8" class="panel" stroke="#d8e2ef"/><text x="702" y="530" class="text" font-size="18">Leave Calendar</text><text x="702" y="560" class="small">Approved and submitted leave from today onward</text>
</svg>
